[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectome-keratitis-pilot"
version = "0.1.0"
description = "A curiosity-driven frozen MaleCNS visual circuit experiment with patient-grouped evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "pillow>=11,<13", "numba>=0.61,<0.68", "threadpoolctl>=3,<4"
]

[project.optional-dependencies]
simulation = ["flyocr", "pyarrow>=18,<24", "pandas>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
flyocr = { git = "https://github.com/jerryjliu/fly_ocr.git", rev = "48cf341e99c17dc911fb09fdc8419d98b4d0ea86" }

[project.scripts]
connectome-pilot = "connectome_pilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/connectome_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
